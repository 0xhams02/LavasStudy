<!DOCTYPE html>
<html lang="en">
<head>
  <title>Bitmovin Modular Player - Advertising + Playlist</title>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,400" rel="stylesheet" />

  <!-- Optional UI stylesheet (works with ui module) -->
  <link rel="stylesheet" href="https://cdn.bitmovin.com/player/web/8/bitmovinplayer-ui.css" />

  <style>
    * { margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: 'Open Sans', sans-serif;
      font-weight: 300;
      color: #fff;
    }

    body {
      background: linear-gradient(to right, rgba(44, 131, 185, 1) 0%, rgba(30, 171, 227, 1) 100%);
    }

    #banner {
      border-bottom: 1px solid #fff;
      background-color: #1eabe3;
      width: 100%;
    }

    #banner h1 {
      margin: 0;
      padding: 22px 16px;
      font-size: 20px;
      font-weight: 300;
      text-align: center;
    }

    #wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .container {
      width: min(980px, 92vw);
      margin: 0 auto;
      padding: 24px 0 48px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    #player {
      width: 100%;
      aspect-ratio: 16 / 9;
      box-shadow: 0 0 56px rgba(0, 0, 0, 0.75);
      background: rgba(0,0,0,0.2);
    }

    .note {
      font-size: 14px;
      opacity: 0.9;
      text-align: center;
      padding: 8px 0;
    }

    a { color: #97d9ef; font-weight: 400; text-decoration: none; }
    a:hover { color: #fff; }
  </style>

  <!-- Bitmovin Player (modules build) -->
  <script src="https://cdn.bitmovin.com/player/web/8/modules/bitmovinplayer-core.js"></script>
  <script src="https://cdn.bitmovin.com/player/web/8/modules/bitmovinplayer-engine-bitmovin.js"></script>
  <script src="https://cdn.bitmovin.com/player/web/8/modules/bitmovinplayer-hls.js"></script>
  <script src="https://cdn.bitmovin.com/player/web/8/modules/bitmovinplayer-mserenderer.js"></script>
  <script src="https://cdn.bitmovin.com/player/web/8/modules/bitmovinplayer-container-ts.js"></script>
  <script src="https://cdn.bitmovin.com/player/web/8/modules/bitmovinplayer-subtitles.js"></script>
  <script src="https://cdn.bitmovin.com/player/web/8/modules/bitmovinplayer-subtitles-cea608.js"></script>
  <script src="https://cdn.bitmovin.com/player/web/8/modules/bitmovinplayer-abr.js"></script>
  <script src="https://cdn.bitmovin.com/player/web/8/modules/bitmovinplayer-polyfill.js"></script>
  <script src="https://cdn.bitmovin.com/player/web/8/modules/bitmovinplayer-style.js"></script>
  <script src="https://cdn.bitmovin.com/player/web/8/modules/bitmovinplayer-ui.js"></script>

  <!-- Advertising modules (Bitmovin Advertising) -->
  <!-- advertising-core depends on xml -->
  <script src="https://cdn.bitmovin.com/player/web/8/modules/bitmovinplayer-xml.js"></script>
  <script src="https://cdn.bitmovin.com/player/web/8/modules/bitmovinplayer-advertising-core.js"></script>
  <script src="https://cdn.bitmovin.com/player/web/8/modules/bitmovinplayer-advertising-bitmovin.js"></script>
</head>
<body>
  <div id="wrapper">
    <div id="banner">
      <h1>Modular Player - Advertising + Playlist（modules 方式）</h1>
    </div>

    <div class="container">
      <div id="player"></div>
      <div class="note">
        需要用 Web Server 打开（不要直接 file://）。
        参考：<a href="https://github.com/bitmovin/bitmovin-player-web-samples/blob/main/modular-player/static.html" target="_blank" rel="noreferrer">官方 modular-player/static.html</a>
      </div>
    </div>
  </div>

  <script>
    // === 你原文件的逻辑：广告 + 正片播放（playlist）===

    const playlist = [
      {
        name: 'Sintel',
        hls: 'https://storage.googleapis.com/shaka-demo-assets/angel-one-hls/playlist_v-0576p-1400k-libx264.mp4.m3u8'
      },
      {
        name: 'Bitmovin Demo Video',
        hls: 'https://storage.googleapis.com/shaka-demo-assets/angel-one-hls/playlist_v-0240p-0400k-libx264.mp4.m3u8'
      }
    ];

    function addParams(url) {
      const sep = url.indexOf('?') === -1 ? '?' : '&';
      const ts = Date.now();
      return url + sep + 'cb=' + ts + '&correlator=' + ts;
    }

    const adBreaks = [
      {
        tag: {
          url: addParams(
            'https://pubads.g.doubleclick.net/gampad/ads?sz=1280x720&iu=/94348418/OTTUNI100007001LGTV&impl=s&vpa=auto&plcmt=1&gdfp_req=1&env=vp&unviewed_position_start=1&url=[referrer_url]&description_url=[description_url]&ad_rule=1&output=xml_vmap1&cmsid=2674704&vid=83872&vid_d=3292&pp=ctv_profile_limitation&cust_params=ott_env%3Dqa%26ott_cate%3Dkoreandrama%26ott_series_id%3D6549%26ott_product_id%3D83872%26ott_cpname%3Dat-x%26ott_content_language%3Dthai%26ott_preview_video%3Dtrue'
          ),
          type: 'vmap'
        },
        id: 'Ad',
        position: 'pre'
      }
    ];

    // === modular-player/static.html 的 modules 方式：手动 addModule ===
    bitmovin.player.core.Player.addModule(window.bitmovin.player['engine-bitmovin'].default);
    bitmovin.player.core.Player.addModule(window.bitmovin.player.mserenderer.default);
    bitmovin.player.core.Player.addModule(window.bitmovin.player.hls.default);
    bitmovin.player.core.Player.addModule(window.bitmovin.player.abr.default);
    bitmovin.player.core.Player.addModule(window.bitmovin.player['container-ts'].default);
    bitmovin.player.core.Player.addModule(window.bitmovin.player['subtitles'].default);
    bitmovin.player.core.Player.addModule(window.bitmovin.player['subtitles-cea608'].default);
    bitmovin.player.core.Player.addModule(window.bitmovin.player.polyfill.default);
    bitmovin.player.core.Player.addModule(window.bitmovin.player.style.default);
    bitmovin.player.core.Player.addModule(window.bitmovin.player.ui.default);

    // Advertising module（modules 方式）
    bitmovin.player.core.Player.addModule(window.bitmovin.player.xml.default);
    bitmovin.player.core.Player.addModule(window.bitmovin.player['advertising-core'].default);
    bitmovin.player.core.Player.addModule(window.bitmovin.player['advertising-bitmovin'].default);

    const conf = {
      key: '7f7d77af-7373-4a18-8435-68baf2fa0274',
      logs: {
        level: 'debug'
      },
      playback: {
        // 为了确保 preroll 一定能在 play() 触发前已 schedule，这里用 autoplay: false
        // 然后在每次 load 后手动 play（行为等同于“自动播放”）
        autoplay: false,
        preload: true,
        muted: false
      },
      tweaks: {
        BACKWARD_BUFFER_PURGE_INTERVAL: 10,
        startup_threshold: 0.5,
        app_id: 'com.viu.tv-webos',
        file_protocol: true
      },
      advertising: {
        allowedUiElements: ['COUNTDOWN', 'AD_ATTRIBUTION'],
      }
    };

    const container = document.getElementById('player');
    const player = new bitmovin.player.core.Player(container, conf);

    // UI（如果 UIFactory 可用就创建默认 UI）
    if (window.bitmovin && window.bitmovin.playerui && window.bitmovin.playerui.UIFactory) {
      window.bitmovin.playerui.UIFactory.buildDefaultUI(player);
    }

    let currentIndex = 0;

    async function scheduleAdBreaks() {
      if (!player.ads) {
        console.warn('[ads] Advertising module not available (player.ads is undefined)');
        return;
      }

      const schedules = adBreaks.map((adBreak) => {
        try {
          player.ads.discardAdBreak(adBreak.id);
        } catch (e) {
          // ignore
        }
        return player.ads.schedule(adBreak);
      });

      await Promise.all(schedules);
    }

    async function playIndex(index) {
      const item = playlist[index];
      if (!item) return;

      try {
        // 每条正片开始前重新 schedule 一次 preroll
        await scheduleAdBreaks();

        // load 新片源
        await player.load({ hls: item.hls });

        console.log('[content] now playing:', item.name);

        // 手动触发播放（会先走 preroll）
        await player.play();
      } catch (err) {
        console.error('[player] load/play failed', err);
      }
    }

    window.onload = function () {
      // 首次播放
      playIndex(currentIndex);

      player.on('playbackfinished', async () => {
        currentIndex = (currentIndex + 1) % playlist.length;

        try {
          // 避免状态残留
          if (player.unload) {
            await player.unload();
          }
        } catch (e) {
          // ignore
        }

        await playIndex(currentIndex);
      });
    };
  </script>
</body>
</html>
